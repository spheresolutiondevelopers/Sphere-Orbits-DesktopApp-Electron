appId: com.sphere.orbits
productName: Sphere Orbits
directories:
  output: release
  buildResources: build
files:
  - packages/main/dist/**/*
  - packages/preload/dist/**/*
  - packages/renderer/dist/**/*
  - node_modules/**/*
extraResources:
  - from: packages/main/src/database/migrations
    to: database/migrations
    filter:
      - "*.sql"
win:
  target: nsis
  icon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.icns
linux:
  target: AppImage
  icon: build/icon.png